# Hạ tầng bản nâng cấp. Mật khẩu đọc từ file .env ở thư mục gốc (xem .env.example).
#
#   docker compose up -d                       # kho, DB app, MinIO, Kafka, Debezium, Kafka UI
#   (Airflow, consumer CDC, producer Wikipedia dùng chung image build từ ./orchestration)
#
# Cổng trên máy:
#   5433 kho dữ liệu (Postgres + pgvector)     9001 MinIO Console     8080 Kafka UI
#   5434 DB app xem phim (nguồn CDC)           9000 MinIO S3 API      8083 Debezium Connect
#   9092 Kafka                                 8081 Airflow
name: movie-platform

x-small: &small
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

# Cấu hình chung cho các container chạy code pipeline (Airflow, consumer, producer).
# Code dự án được mount vào /opt/project, dùng chung 1 image.
x-pipeline-env: &pipeline-env
  PYTHONPATH: /opt/project
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  LAKE_ROOT: s3://lake
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  KAFKA_BOOTSTRAP: kafka:29092
  CONNECT_URL: http://connect:8083
  WIKIMEDIA_CONTACT: ${WIKIMEDIA_CONTACT:-}
  DW_HOST: dw
  DW_PORT: "5432"
  DW_PASSWORD: ${DW_PASSWORD}
  APP_DB_HOST: app-db
  APP_DB_PORT: "5432"
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  DATA_HOME: /opt/data
  ML1M_DIR: /opt/project/data/raw/ml-1m

x-pipeline: &pipeline
  build: ./orchestration
  image: movie-platform-airflow:2.10.4
  working_dir: /opt/project
  environment: *pipeline-env
  volumes:
    - ./:/opt/project
    - pipeline_data:/opt/data

services:
  dw:
    <<: *small
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: movie_dw
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: ${DW_PASSWORD:?Điền DW_PASSWORD trong .env}
    command: postgres -c shared_buffers=256MB -c max_wal_size=2GB
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - dw_data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw -d movie_dw"]
      interval: 5s
      retries: 20

  app-db:
    <<: *small
    image: postgres:17.11
    environment:
      POSTGRES_DB: movie_app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Điền APP_DB_PASSWORD trong .env}
    # wal_level=logical: bắt buộc để Debezium đọc được thay đổi từ WAL (CDC dựa trên log).
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - app_data:/var/lib/postgresql/data
      - ./app_source/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d movie_app"]
      interval: 5s
      retries: 20

  minio:
    <<: *small
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z   # bản fork cộng đồng, MinIO gốc đã ngừng phát hành image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Điền S3_ACCESS_KEY trong .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Điền S3_SECRET_KEY trong .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - minio_data:/data

  kafka:
    <<: *small
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["127.0.0.1:9092:9092"]
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      retries: 20

  connect:
    <<: *small
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      kafka: { condition: service_healthy }
      app-db: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["127.0.0.1:8083:8083"]

  kafka-ui:
    <<: *small
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: movie-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports: ["127.0.0.1:8080:8080"]

  # Consumer chạy nền: Kafka (CDC + Wikipedia) -> MinIO bronze.
  cdc-consumer:
    <<: [*small, *pipeline]
    depends_on:
      kafka: { condition: service_healthy }
      minio: { condition: service_started }
    command: ["python", "-m", "cdc.kafka_to_bronze"]

  # Producer chạy nền: Wikimedia EventStreams -> Kafka.
  wiki-producer:
    <<: [*small, *pipeline]
    depends_on:
      kafka: { condition: service_healthy }
    command: ["python", "-m", "streaming.wiki_producer"]

  airflow:
    <<: [*small, *pipeline]
    depends_on:
      dw: { condition: service_healthy }
    environment:
      <<: *pipeline-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Cho phép app gọi REST API (nút "Chạy pipeline ngay") bằng tài khoản admin.
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dw:${DW_PASSWORD}@dw:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Điền AIRFLOW_SECRET_KEY trong .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Điền AIRFLOW_ADMIN_PASSWORD trong .env}
    ports: ["127.0.0.1:8081:8080"]
    command: ["bash", "/opt/project/orchestration/start.sh"]

volumes:
  dw_data:
  app_data:
  minio_data:
  kafka_data:
  pipeline_data:
