name: btl-movielens-s11b4-restore

x-runtime: &runtime
  image: btl-movielens-superset:6.1.0-local
  environment:
    SUPERSET_CONFIG_PATH: /app/s11b4/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Configure local .env}
    METADATA_PASSWORD: ${METADATA_PASSWORD:?Configure local .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure local .env}
  volumes:
    - ./superset_config.py:/app/s11b4/superset_config.py:ro
    - ../superset/init_metadata.py:/app/s11b4/init_metadata.py:ro
    - restore_home:/app/superset_home
  labels:
    btl.step: 11B-4
    btl.purpose: isolated-dashboard-restore-test
  cpus: 2
  mem_limit: 2g

services:
  metadata:
    image: postgres:17.11
    environment:
      POSTGRES_DB: superset_metadata
      POSTGRES_USER: superset_meta
      POSTGRES_PASSWORD: ${METADATA_PASSWORD:?Configure local .env}
    volumes:
      - restore_metadata:/var/lib/postgresql/data
    labels:
      btl.step: 11B-4
      btl.purpose: isolated-dashboard-restore-test
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U superset_meta -d superset_metadata"]
      interval: 5s
      timeout: 5s
      retries: 20
  init:
    <<: *runtime
    command: [python, /app/s11b4/init_metadata.py]
    depends_on:
      metadata:
        condition: service_healthy
  web:
    <<: *runtime
    command: [gunicorn, --bind, "0.0.0.0:8088", --workers, "1", --timeout, "120", "superset.app:create_app()"]
    ports:
      - "127.0.0.1:8091:8088"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  restore_metadata:
    labels:
      btl.step: 11B-4
  restore_home:
    labels:
      btl.step: 11B-4
