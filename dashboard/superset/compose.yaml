name: btl-movielens-superset

x-runtime: &runtime
  build: .
  image: btl-movielens-superset:6.1.0-local
  environment:
    SUPERSET_CONFIG_PATH: /app/project/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Configure locally}
    METADATA_PASSWORD: ${METADATA_PASSWORD:?Configure locally}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure locally}
  volumes:
    - superset_home:/app/superset_home

services:
  metadata:
    image: postgres:17.11
    environment:
      POSTGRES_DB: superset_metadata
      POSTGRES_USER: superset_meta
      POSTGRES_PASSWORD: ${METADATA_PASSWORD:?Configure locally}
    volumes:
      - metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U superset_meta -d superset_metadata"]
      interval: 5s
      timeout: 5s
      retries: 20
  init:
    <<: *runtime
    command: [python, /app/project/init_metadata.py]
    depends_on:
      metadata:
        condition: service_healthy
  web:
    <<: *runtime
    command: [gunicorn, --bind, "0.0.0.0:8088", --workers, "2", --timeout, "120", "superset.app:create_app()"]
    ports:
      - "127.0.0.1:8089:8088"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  metadata_data:
  superset_home:
